services:
  postgres:
    image: postgres:16-alpine
    container_name: vote-static-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vote_static
    ports:
      - "5432:5432"
    volumes:
      - vote_static_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vote_static"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vote_static_pgdata:
